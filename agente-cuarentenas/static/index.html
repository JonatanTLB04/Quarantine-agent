:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#FF6600; --orange-dk:#FF3300; --charcoal:#1A1A1A;
  --bg:#EEF2F5; --surface:#FFF; --surface-2:#F5F5F5; --line:#DDE2E7;
  --ink:#000; --muted:#6B7280; --tint:#FFF8F4;
  --display:"Bebas Neue Pro","Arial Black",Impact,sans-serif;
  --body:Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1A1A1A;--surface-2:#242424;--line:#333;--ink:#FFF;--muted:#9CA3AF;--tint:#2A1A10}}
:root[data-theme="dark"]{--bg:#000;--surface:#1A1A1A;--surface-2:#242424;--line:#333;--ink:#FFF;--muted:#9CA3AF;--tint:#2A1A10}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.display{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px;background:#000;color:#fff;border-bottom:3px solid var(--orange);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{height:22px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:#444}
.brand .area{font-size:20px}
.agent{display:flex;align-items:center;gap:10px;font-size:13px;color:#C4C8CE}
.agent b{color:#fff}
.pulse{width:10px;height:10px;background:var(--orange);transform:rotate(45deg);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}

.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;border-top:3px solid var(--line)}
.kpi.hot{border-top-color:var(--orange)}
.kpi.err{border-top-color:var(--orange-dk)}
.kpi .v{font-family:var(--display);font-size:44px;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.spacer{flex:1}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:300px}
.search:focus{outline:none;border-color:var(--orange)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row,.hrow{display:grid;grid-template-columns:90px 130px minmax(0,2.2fr) 150px 190px 150px;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.hrow{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.row{cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.new{animation:fl 2.4s ease-out}
@keyframes fl{from{background:var(--tint)}to{background:transparent}}
.time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.msg b{font-weight:700}
.msg span{font-size:12.5px;color:var(--muted)}
.tick{font-family:var(--mono);font-size:12.5px}
.tick span{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}

.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
.t-hs{background:var(--ink);color:var(--surface)}
.t-dx{border:1.5px solid var(--orange);color:var(--ink)}

.res{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.res::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--ink)}
.res.warn::before{background:var(--orange-dk)}
.act{font-size:13px}
.act b{font-weight:700}

.det{grid-column:2/-1;background:var(--surface-2);border-left:3px solid var(--orange);padding:12px 14px;font-size:13.5px;margin-top:4px;cursor:default}
.det dl{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;margin:0}
.det dt{color:var(--muted)}
.det dd{margin:0;word-break:break-word}
.det code{font-family:var(--mono);font-size:12.5px}

.empty{padding:40px;text-align:center;color:var(--muted)}
.alert-obs{background:var(--tint);border-left:4px solid var(--orange);padding:11px 16px;font-size:14px;margin-bottom:16px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hrow{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"tag time" "msg msg" "act act" "tick res";row-gap:6px}
  .row>:nth-child(1){grid-area:time;justify-self:end}.row>:nth-child(2){grid-area:tag}
  .row>:nth-child(3){grid-area:msg}.row>:nth-child(4){grid-area:act}
  .row>:nth-child(5){grid-area:tick}.row>:nth-child(6){grid-area:res;justify-self:end}
  .det{grid-column:1/-1}.det dl{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
  .brand .sep,.brand .area{display:none}
  .wrap{padding:16px 14px 40px}
}
@media (prefers-reduced-motion:reduce){.pulse,.row.new{animation:none}}
</style>
</head>

-5.75-6.88h-4V75.72Z" fill="#fff"/>          <path d="M351.75,70.38V40.57c0-9.07,4.78-14.25,13.52-14.25S378.8,31.5,378.8,40.57V70.38c0,9.07-4.78,14.25-13.53,14.25S351.75,79.45,351.75,70.38Zm18.14.56V40c0-4-1.78-5.58-4.62-5.58S360.66,36,360.66,40V70.94c0,4,1.78,5.59,4.61,5.59S369.89,75,369.89,70.94Z" fill="#fff"/>          <path d="M391.76,54.83,382,27.13h9.39l6.08,18.54,6.23-18.54h8.43l-9.8,27.7,10.28,29h-9.39l-6.56-20-6.72,20h-8.43Z" fill="#fff"/>        </g>      </g>    </g>  </g></svg></span>
    <span class="sep" aria-hidden="true"></span>
    <span class="area display">Soporte TI | Cuarentenas de correo</span>
  </div>
  <div class="agent" id="agent"></div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <section class="kpis" id="kpis"></section>
  <div class="toolbar">
    <span id="chips"></span>
    <span class="spacer"></span>
    <input class="search" id="q" type="search" placeholder="Buscar remitente, asunto o ticket" aria-label="Buscar">
  </div>
  <div class="list" role="table" aria-label="Historial del agente">
    <div class="hrow" role="row"><span>Hora</span><span>Cliente</span><span>Registro</span><span>En Google</span><span>Autotask</span><span>Resultado</span></div>
    <div id="rows"><div class="empty">Cargando...</div></div>
  </div>
  <p class="note">Se actualiza solo cada 30 segundos.</p>
</div>

<script>
const VERD={phishing:"Phishing",spam:"Spam",legit:"Legítimo",unsure:"Dudoso"};
const RES={ok:"Completado",review:"Revisar",observacion:"Observación",error:"Error"};
let logs=[],status={},filter="all",query="",open=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm=iso=>iso?new Date(iso).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}):"--";
const day=iso=>new Date(iso).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
const isToday=iso=>new Date(iso).toDateString()===new Date().toDateString();
const clients=()=>[...new Set(logs.map(l=>l.client).filter(Boolean))];

async function load(){
  try{
    const [s,l]=await Promise.all([fetch("/api/status").then(r=>r.json()),fetch("/api/logs").then(r=>r.json())]);
    status=s; logs=l; render();
  }catch(e){document.getElementById("rows").innerHTML='<div class="empty">No se pudo cargar el historial.</div>'}
}

function renderAgent(){
  const mode=status.mode==="real"?"Modo real":"Modo observación";
  document.getElementById("agent").innerHTML=`<span class="pulse" aria-hidden="true"></span><span><b>${status.running?"Corriendo ahora":"Agente activo"}</b> | ${mode} | Última corrida ${hm(status.last_run)} | Próxima ${hm(status.next_run)}</span>`;
  const b=document.getElementById("banner");
  b.innerHTML=status.mode!=="real"?`<div class="alert-obs">Modo observación: el agente decide pero no toca Google ni Autotask. Cada registro dice lo que <b>habría hecho</b>.</div>`:"";
}
function renderKpis(){
  const t=logs.filter(l=>isToday(l.ts));
  const msgs=t.filter(l=>l.kind==="message");
  const closed=t.filter(l=>l.kind==="tickets"&&l.result!=="observacion").reduce((n,l)=>n+((l.detail||"").match(/^Cerrados: (.+?)(\.|$)/)?.[1].split(",").filter(x=>x.trim()&&x.trim()!=="ninguno").length||0),0);
  const rev=t.filter(l=>l.result==="review"||l.result==="error").length;
  const k=[
    {v:closed,l:"Tickets cerrados solos hoy",cls:"hot"},
    {v:msgs.filter(l=>l.decision==="allow").length,l:"Allow hoy"},
    {v:msgs.filter(l=>l.decision==="deny").length,l:"Deny hoy"},
    {v:msgs.length,l:"Correos revisados hoy"},
    {v:rev,l:"Para revisar",cls:rev?"err":""}
  ];
  document.getElementById("kpis").innerHTML=k.map(x=>`<div class="kpi ${x.cls||""}"><div class="v">${x.v}</div><div class="l">${x.l}</div></div>`).join("");
}
function renderChips(){
  const el=document.getElementById("chips");
  el.innerHTML=[["all","Todos"],...clients().map(c=>[c,c])].map(([k,l])=>`<button class="chip" aria-pressed="${filter===k}" data-f="${esc(k)}">${esc(l)}</button>`).join(" ");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
}
function tagCls(c){return clients().indexOf(c)%2?"t-dx":"t-hs"}
function row(l){
  const warn=l.result==="review"||l.result==="error";
  let main,act,tk;
  if(l.kind==="message"){
    main=`<b class="cut">${esc(l.subject)}</b><span class="cut">${esc(l.sender)}</span>`;
    act=`<b>${esc(l.google_action)}</b> | ${VERD[l.category]||esc(l.category)}`;
    tk=`${esc(l.tickets)}<span>Tickets de esta corrida</span>`;
  }else if(l.kind==="tickets"){
    main=`<b class="cut">Resumen de tickets</b><span class="cut">${esc(l.detail)}</span>`;
    act="<b>-</b>"; tk=`${esc(l.tickets)}<span>${l.result==="observacion"?"Sin cambios (observación)":"Ver detalle"}</span>`;
  }else{
    main=`<b class="cut">Error en la corrida</b><span class="cut">${esc(l.detail)}</span>`; act="<b>-</b>"; tk="<span>Sin cambios</span>";
  }
  const det=open===l.id?`<div class="det"><dl>
    ${l.recipient?`<dt>Destinatario</dt><dd>${esc(l.recipient)}</dd>`:""}
    ${l.why?`<dt>Por qué decidió así</dt><dd>${esc(l.why)}</dd>`:""}
    ${l.detail?`<dt>Detalle</dt><dd>${esc(l.detail)}</dd>`:""}
    ${l.tickets?`<dt>Tickets</dt><dd>${esc(l.tickets)}</dd>`:""}
    <dt>Fecha</dt><dd>${day(l.ts)}, ${hm(l.ts)}</dd>
  </dl></div>`:"";
  return `<div class="row" role="row" data-id="${l.id}">
    <span class="time">${hm(l.ts)}</span>
    <span><span class="tag ${tagCls(l.client)}">${esc(l.client)}</span></span>
    <span class="msg">${main}</span>
    <span class="act">${act}</span>
    <span class="tick">${tk}</span>
    <span class="res ${warn?"warn":""}">${RES[l.result]||esc(l.result)}</span>${det}</div>`;
}
function renderRows(){
  const q=query.toLowerCase();
  const v=logs.filter(l=>(filter==="all"||l.client===filter)&&(!q||[l.subject,l.sender,l.tickets,l.detail,l.client].join(" ").toLowerCase().includes(q)));
  const el=document.getElementById("rows");
  el.innerHTML=v.length?v.map(row).join(""):'<div class="empty">Todavía no hay registros. Aparecen en cuanto el agente encuentre tickets de cuarentena.</div>';
  el.querySelectorAll(".row").forEach(r=>r.onclick=e=>{if(e.target.closest(".det"))return;const id=+r.dataset.id;open=open===id?null:id;renderRows()});
}
function render(){renderAgent();renderKpis();renderChips();renderRows()}
document.getElementById("q").oninput=e=>{query=e.target.value;renderRows()};
load(); setInterval(load,30000);
</script>
</body>
</html>
